<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting App - Swiss Monochrome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0A0A0A;
      --text: #EDEDED;
      --text-muted: #888888;
      --border: #333333;
      --border-hover: #EDEDED;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .btn {
      background-color: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: transparent;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1px;
      background-color: var(--border);
      border: 1px solid var(--border);
    }

    .card {
      background-color: var(--card-bg);
      padding: 32px 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
      position: relative;
    }

    .card:hover {
      background-color: #141414;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 1px;
      background-color: var(--border-hover);
      transition: width 0.3s ease;
    }

    .card:hover::before {
      width: 100%;
    }

    .card-title {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      margin: 0 0 40px 0;
      color: var(--text);
    }

    .card-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .votes {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Joined Polls</h1>
      <button class="btn">Create New Poll</button>
    </header>

    <div class="grid">
      <div class="card">
        <h3 class="card-title">Which features should we prioritize for Q4?</h3>
        <div class="card-meta">
          <span>04 OPT</span>
          <span class="votes">156 VOTES</span>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Where should we host our next company offsite?</h3>
        <div class="card-meta">
          <span>03 OPT</span>
          <span class="votes">89 VOTES</span>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Pick the new logo design</h3>
        <div class="card-meta">
          <span>02 OPT</span>
          <span class="votes">210 VOTES</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
