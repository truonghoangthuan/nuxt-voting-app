<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting App - Candy Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1CB0F6;
      --primary-dark: #1899D6;
      --success: #58CC02;
      --success-dark: #46A302;
      --bg: #ffffff;
      --text: #4B4B4B;
      --text-light: #AFB6BA;
      --border: #E5E5E5;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin: 0;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: 2px solid transparent;
      border-bottom: 4px solid var(--primary-dark);
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      border-bottom-width: 0px;
      transform: translateY(4px);
      margin-bottom: 4px;
    }

    .btn-success {
      background-color: var(--success);
      border-bottom-color: var(--success-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card:hover {
      border-color: #d1d1d1;
      border-bottom-color: #d1d1d1;
    }

    .card:active {
      border-bottom-width: 2px;
      transform: translateY(2px);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 16px 0;
      line-height: 1.4;
      color: var(--text);
    }

    .card-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 2px solid var(--border);
    }

    .tag {
      background: #F7F7F7;
      color: var(--text-light);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    .votes {
      color: var(--success);
      font-weight: 800;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Joined Polls</h1>
      <button class="btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Create New Poll
      </button>
    </header>

    <div class="grid">
      <div class="card">
        <h3 class="card-title">Which features should we prioritize for Q4?</h3>
        <div class="card-meta">
          <span class="tag">4 Options</span>
          <span class="votes">156 Votes</span>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Where should we host our next company offsite?</h3>
        <div class="card-meta">
          <span class="tag">3 Options</span>
          <span class="votes">89 Votes</span>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Pick the new logo design</h3>
        <div class="card-meta">
          <span class="tag">2 Options</span>
          <span class="votes">210 Votes</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
